<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- As in index.html: Dark Reader keeps off a page with this tag. -->
<meta name="darkreader-lock">
<title>eznix (%%EZNIX_HOSTNAME%%) — login</title>
<!-- favicon.svg is drawn by the server in the configured theme's colours -- see index.html's
     own comment on this. manifest.json is linked here too, not just index.html: a user who tries
     "Install page as app" while still on the login page (before authenticating) hits the exact
     same missing-manifest letter-monogram fallback manifest.json was added to fix in the first
     place if this page doesn't also link it -- and since both pages share the same origin/root,
     the resulting installed shortcut ends up at the same site either way. -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<!-- As in index.html: the colour of the window's bar where the page is an installed app,
     filled in below with this page's own fill. -->
<meta name="theme-color" id="window-colour">
%%EZNIX_THEME_LINKS%%
<link rel="stylesheet" href="style.css">
<style>
  /* Dressed like the editor itself: the page is the editor's page, the card is a top-level
     section's card (same fill, hairline and soft shadow -- .section.nest-top in style.css), and
     the two fields are an option's value in a section: the fill and corners of its cell
     (.field-row.nest > .field-value) and no line around them, only larger and in another
     font. On 2026-10-13 the card had the fill of the bars at the top (--bg2) for a few
     minutes, at the user's wish, and the fields the line of a text field outside a section
     (--input-border), my reading of "like input boxes inside"; the user saw that they did
     not look like a value in a section, and both went back. */
  body { align-items: center; justify-content: center; overflow: auto; background: var(--editor-bg); }
  .login-card {
    background: var(--card-bg); border-radius: var(--radius);
    box-shadow: 0 0 0 1px var(--panel-hairline), 0 0 var(--panel-shadow-size) var(--panel-shadow);
    padding: 40px 36px; width: 100%; max-width: 360px;
  }
  /* The logo is the tab's icon, favicon.svg: drawn by the server in the configured theme's
     colours, an automatic theme's dark pair behind a media query of its own. */
  .login-logo { display: block; width: 64px; height: 64px; margin: 0 auto 18px; }
  .login-card h1 { font-size: 18px; font-weight: 700; margin-bottom: 28px; text-align: center; color: var(--section-title-color); letter-spacing: .04em; }
  .login-card input {
    display: block; margin-bottom: 16px; padding: 8px 11px;
    background: var(--value-bg); border: 0; border-radius: var(--radius);
    font: 400 13.3333px sans-serif;
  }
  /* Not the theme's font, alone among the inputs: while a saved login is only being offered (its
     entry in the browser's list highlighted, not yet chosen), Chromium shows it in the field in
     its own font for form fields, whatever the field's is. Seen in Brave on a Mac (2026-10-11),
     the name jumping from the theme's monospace to the system's font and back. The browser's
     rule for that state is !important, on purpose (a security fix in Chrome 74, the bug closed
     as won't fix), and restating the font on the field's ::first-line, the workaround usually
     given, was tried that day and did nothing. So the fields have that font to begin with.
     It is read out of the browser's own stylesheet (Brave's resources.pak, unpacked):
     "font: -webkit-small-control !important", which is 13.3333px, and "font-family: sans-serif
     !important", the generic family and not the system's font (system-ui was tried first and
     still jumped: on a Mac sans-serif is Helvetica). */
  /* No labels: an empty field says what it is for, as an empty value does in the editor. */
  .login-card input::placeholder { color: var(--text3); opacity: 1; }
  /* A field the browser has filled in from a saved login gets the browser's own pale fill, set
     in a way a page's background can't override. An inset shadow painted over it can, and the
     text colour needs restating the same way. (Firefox tints with a filter instead.) The shadow
     only covers the inside of a border, which is why these fields have none at all: a
     transparent one left a 1px ring of the browser's fill showing around an autofilled field. */
  .login-card input:-webkit-autofill,
  .login-card input:-webkit-autofill:hover,
  .login-card input:-webkit-autofill:focus,
  .login-card input:autofill {
    -webkit-box-shadow: 0 0 0 1000px var(--value-bg) inset;
    box-shadow: 0 0 0 1000px var(--value-bg) inset;
    -webkit-text-fill-color: var(--text);
    caret-color: var(--text);
    filter: none;
    /* The shadow alone still left a thin pale ring: at the rounded edge the browser's fill and
       the shadow on top of it are both anti-aliased, and the fill shows through that last
       fraction of a pixel. A transition this long means the browser's fill never actually
       arrives -- the field keeps the background it already had -- so there is nothing
       underneath to show through. */
    transition: background-color 600000s 0s, color 600000s 0s;
  }
  /* An ordinary button of the editor's (.btn in style.css, which also gives it its hover), as
     tall as those in the header; only its width is the page's own. */
  .login-card .btn { width: 100%; height: 28px; justify-content: center; margin-top: 4px; }
  /* The button gets the cursor once a saved login is chosen (the script below), so it shows it:
     its one border in the colour of its text, which stands out from its fill in any theme. It
     was a ring in the focus colour around the border, two lines. The button is an ordinary
     one of the editor's, as the header's are; it was the filled kind (.primary) before. */
  .login-card .btn:focus { outline: none; border-color: currentColor; }
  .login-error { color: var(--red); font-size: 12px; margin-top: 14px; min-height: 18px; text-align: center; }
  .login-ca-link { text-align: center; margin-top: 14px; font-size: 11px; }
  .login-ca-link a { color: var(--text2); text-decoration: none; }
  .login-ca-link a:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="login-card">
  <img class="login-logo" src="favicon.svg" alt="">
  <h1>eznix (%%EZNIX_HOSTNAME%%)</h1>
  <form method="post" action="/login">
    <input id="u" name="username" type="text" autocomplete="username" placeholder="Username" aria-label="Username" autofocus>
    <input id="p" name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
    <button type="submit" class="btn">Sign in</button>
  </form>
  <div class="login-error">%%EZNIX_ERROR%%</div>
  %%EZNIX_CA_LINK%%
</div>
<script>
document.getElementById('window-colour').content = getComputedStyle(document.body).backgroundColor;
// Tab is the browser's own: the name, the password, the button. A script kept it to those
// until 2026-10-11, mostly to keep it off an arrow beside the name that listed the users.
(function() {
  var p = document.getElementById('p'), button = document.querySelector('.login-card button[type=submit]');
  // Choosing a saved login in the browser's list fills both fields in and leaves the cursor
  // where it was, at the end of the name, as if there were more to type. The button takes it
  // instead: what is left to do is sign in. The browser says a field is its doing with
  // :autofill, and tells the page with an event on the field. One that comes right after a
  // click or a key on the page is left alone: a browser that filled the fields in by itself
  // when the page opened only says so at the first of those, and that would take the cursor
  // away from whoever clicked on the name to change it.
  // A key with no name is not somebody's: Chromium sends the field one as it fills it in, for
  // pages that wait for typing, and counting it made every fill look like the page's own.
  var touched = 0;
  function filled(el) {
    try { return el.matches(':autofill'); } catch (e) {}
    try { return el.matches(':-webkit-autofill'); } catch (e) {}
    return false;
  }
  ['pointerdown', 'keydown'].forEach(function(type) {
    document.addEventListener(type, function(e) {
      if (type === 'keydown' && (!e.key || e.key === 'Unidentified')) return;
      touched = Date.now();
    }, true);
  });
  ['input', 'change'].forEach(function(type) {
    p.addEventListener(type, function() {
      if (Date.now() - touched < 300) return;
      setTimeout(function() { if (p.value && filled(p)) button.focus(); }, 0);
    });
  });
})();
</script>
</body>
</html>
