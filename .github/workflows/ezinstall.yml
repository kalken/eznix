# Tells ezinstall (github.com/kalken/ezinstall) to build a new installer ISO with eznix's
# main at this commit; ezinstall's workflow then builds with exactly it and releases it.
# Only by hand since 2026-10-26 (the user's choice "for now"): it ran on every push to main
# that touched flake.nix, bin/, webroot/, plugins/ or nix/.
# Starting another repository's workflow needs a token of its own: EZINSTALL_TOKEN, a
# fine-grained token with "Contents: read and write" on kalken/ezinstall.
name: Tell ezinstall

on:
  # By hand: Actions, "Tell ezinstall", Run workflow.
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send eznix-main to ezinstall
        env:
          GH_TOKEN: ${{ secrets.EZINSTALL_TOKEN }}
        run: gh api repos/kalken/ezinstall/dispatches -f event_type=eznix-main -f "client_payload[eznix]=$GITHUB_SHA"
