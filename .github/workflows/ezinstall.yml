# Tells ezinstall (github.com/kalken/ezinstall) to build a new installer ISO when what
# the ISO takes from eznix changes on main: the program, the page, the plugins and the
# Nix modules. ezinstall's workflow then builds with exactly this commit and releases it.
# Starting another repository's workflow needs a token of its own: EZINSTALL_TOKEN, a
# fine-grained token with "Contents: read and write" on kalken/ezinstall.
name: Tell ezinstall

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - bin/**
      - webroot/**
      - plugins/**
      - nix/**
  # By hand too (Actions, "Tell ezinstall", Run workflow), to test the token.
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send eznix-main to ezinstall
        env:
          GH_TOKEN: ${{ secrets.EZINSTALL_TOKEN }}
        run: gh api repos/kalken/ezinstall/dispatches -f event_type=eznix-main -f "client_payload[eznix]=$GITHUB_SHA"
