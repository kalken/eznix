# eznix.toml: every setting eznix reads. All are optional; the values shown are the defaults
# unless the comment says otherwise. Run with:  eznix --config eznix.toml
# (The Nix modules write this file for you from services.eznix.*.)

# The flake being edited, and the folder of *.json files inside it.
flake        = "/etc/nixos"            # /etc/nix-darwin on macOS
# config_dir   = "/etc/nixos/eznix"    # default: <flake>/eznix
default_file = "configuration.json"   # the file to open first
# exclude    = ["package.json", "vendor", "*.lock.json"]
#                                     # what in config_dir is not configuration, read like the
#                                     # lines of a .gitignore: a name (at any depth; a folder
#                                     # with everything under it), "/name" from the top only,
#                                     # the wildcards * ? [a-z] **, "!entry" to take one back.
#                                     # Give eznix.lib.jsonDir the same list.

# Where eznix keeps its own data: sessions, backups, suggestions, keys.
# state_dir        = "~/.local/state/eznix"
# autocomplete_dir = "<state_dir>/autocomplete"

# interfaces = ["lo", "enp1s0"]       # be reached through these network interfaces and no
#                                     # other, on every address they have. "lo" is this
#                                     # machine itself, and all there is with nothing set;
#                                     # [] is every interface.
# listen_addresses = ["192.168.1.2"]  # answer on these addresses alone: through any
#                                     # interface with interfaces not set, else of
#                                     # those the interfaces have
#                                     # Reached from elsewhere by a host name: list it in
#                                     # hosts (and have the certificate made for it), or
#                                     # saving by that name is refused; by a plain address
#                                     # it works without.
port   = 9090
# hosts = ["nix.example.org"]         # extra host names to accept; ["*"] accepts any, which lets a site that points its name here in (an address needs no entry)
#                                     # behind a proxy that changes the Host header, add the
#                                     # page's address too: "https://nix.example.org"
# trusted_proxies = ["127.0.0.1"]     # a proxy in front of eznix: the failed-login limit is
#                                     # per address, and without this everyone behind the
#                                     # proxy counts as one. The client's address is then
#                                     # read from X-Forwarded-For, which the proxy must set.

# HTTPS: a certificate and its key. (`eznix --generate-ca DIR` makes a pair, and the local
# authority that signs it; `ca` offers that authority for download on the login page.)
# cert = "/path/localhost.pem"
# key  = "/path/localhost-key.pem"
# ca   = "/path/ca.pem"

# Who may log in with their system password. With no users and no password (below), it is
# whoever runs eznix.
# users = ["alice"]
# auth_helper = "/run/wrappers/bin/eznix-auth"   # checks passwords for an unprivileged eznix

# The terminal. Run by hand, eznix starts one itself, as whoever runs it, on terminal_port.
terminal               = true
# terminal_port        = 9091         # default: port + 1
terminal_auto_hide     = true         # hide the open panel on a click outside it
terminal_end_on_logout = true
# terminal_restart = ["systemctl", "--user", "restart", "eznix-terminal.service"]   # {user}, {uid} are filled in

theme    = "nixos"                    # nixos, gruvbox, and osx, breeze, gnome, which follow the
                                      # system (osx-dark, osx-light and so on for one of the
                                      # two regardless); "osx" on macOS
# themes_dir = "/path/to/themes"      # your own, <name>.css each
# collapse_level = 4                  # sections start out folded from this level down (a top-
                                      # level one is 1); not set: nothing is folded
# arrow_level = 3                     # open sections have an arrow from this level down (a
                                      # folded one always has); 0: none
# indent = 2                          # characters of indent per level in the editor
# debug  = true                       # log what is only worth knowing while looking into
#                                     # something: every request and what took long, and in
#                                     # the browser's console what the page does
# mode   = "install"                  # a second row of buttons, for an installer image
backups  = 5                          # earlier versions kept of each file; 0: none

# Plugins. The shipped ones are on; `enabled = false` leaves one out.
# plugins_dir = "/path/to/plugins"    # your own, one folder each

# From here on everything is a table: in TOML a plain setting written below a [table] line
# belongs to that table, so the ones above have to stay above.

# How long a login lasts. With nothing set here, until the page has been closed for 15
# minutes (the browser quit, the computer asleep), and a day after logging in at the latest.
# [session]
# days  = 30                          # that many days, page open or not; 400 at most, the
#                                     # longest a browser keeps a cookie
# renew = true                        # count them from the last time the page was opened,
#                                     # not from the login

# A terminal run by something else (a service manager), for one user. dir and shell must be
# what that terminal was started with.
# [terminals.alice]
# port     = 9091
# key_file = "/run/eznix-terminal/alice/key"
# dir      = "/etc/nixos"

# Log in with one password instead of a system password (same as: eznix --password PW).
# [plugin.password]
# password      = "change-me"
# password_file = "/path/to/file"
# username      = "alice"             # default: whoever runs eznix

# Menus of the flake's files, each a button; a file opens in a program of your choosing, in a
# terminal of its own beside the configuration. With no menus set there is this one:
# [plugin.files]
# editor   = "vim"                    # what files open in; default: $EDITOR in your shell, or nano
# auto_hide = true                    # an open file goes out of the way on a click outside it
# exclude  = [".*"]                   # what no menu lists, read like `exclude` above
# [[plugin.files.menus]]
# name       = "Nix files"            # what the button says
# extensions = [".nix"]               # the files it lists, by how their names end
# command    = "code --wait"          # opened with this in place of `editor`

# The flake's Markdown files, to read beside the configuration.
# [plugin.documents]
# auto_hide = true                    # an open document goes out of the way on a click outside it

# Export, import and restore of the whole flake.
# [plugin.system]
# backups  = 5                        # automatic backups kept; 0: none
# exclude  = [".*", "secrets", "*.key"]
#                                     # what an export leaves out, read like the lines of a
#                                     # .gitignore, as `exclude` above is. Default [".*"]:
#                                     # dot-files and dot-folders; a list of your own
#                                     # replaces it
# keep     = ["hardware-configuration.nix"]
#                                     # what an import leaves as it is on this machine

# [plugin.documents]
# enabled = false

# Command buttons in the terminal bar.
# [[buttons]]
# label       = "Rebuild"
# command     = "sudo nixos-rebuild switch"
# description = "Builds and switches"  # shown when the pointer rests on the button, above the command
# save_first  = true                  # saves unsaved changes before it runs
# clear_first = true
# menu        = "System"              # buttons sharing a menu name become one dropdown; "A/B" nests
# separator   = "before"              # a dividing line beside it: "before", "after" or "both"
#
# A menu itself, by its name: where it stands, and a line beside it.
# [menus.System]
# order     = 10                      # lowest first; plain buttons and other menus count as 0
# separator = "before"
# static      = true
